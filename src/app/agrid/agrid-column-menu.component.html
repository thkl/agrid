<div
  class="ag-filter-menu"
  [style.left.px]="x()"
  [style.top.px]="y()"
  (click)="$event.stopPropagation()"
>
  <div class="ag-filter-menu-section">
    <button
      class="ag-filter-menu-item"
      [class.ag-filter-menu-item--active]="sortDir() === 'asc'"
      (click)="sort.emit('asc')"
    >↑ {{ localeText().sortAscending }}</button>
    <button
      class="ag-filter-menu-item"
      [class.ag-filter-menu-item--active]="sortDir() === 'desc'"
      (click)="sort.emit('desc')"
    >↓ {{ localeText().sortDescending }}</button>
    @if (sortDir()) {
      <button class="ag-filter-menu-item" (click)="sort.emit(sortDir()!)">{{ localeText().clearSort }}</button>
    }
  </div>

  @if (showColumnActions()) {
    <div class="ag-filter-menu-section ag-filter-menu-section--border">
      <button class="ag-filter-menu-item" (click)="autosize.emit()">↔ {{ localeText().autosizeColumn }}</button>
      <button
        class="ag-filter-menu-item"
        [class.ag-filter-menu-item--active]="pinned()"
        (click)="togglePin.emit()"
      >⊣ {{ pinned() ? localeText().unpinColumn : localeText().pinColumn }}</button>
      <button class="ag-filter-menu-item" (click)="hide.emit()">{{ localeText().hideColumn }}</button>
    </div>
  }

  @if (showColumnActions()) {
    <div class="ag-filter-menu-section ag-filter-menu-section--border">
      <span class="ag-filter-menu-aggregate-label">Aggregate</span>
      <div class="ag-filter-menu-aggregate-btns">
        @for (opt of aggregateOptions; track opt.value) {
          <button
            class="ag-aggregate-btn"
            [class.ag-aggregate-btn--active]="aggregate() === opt.value"
            [title]="opt.label"
            (click)="setAggregate.emit(aggregate() === opt.value ? null : opt.value)"
          >{{ opt.symbol }}</button>
        }
      </div>
    </div>
  }

  @if (groupable()) {
    <div class="ag-filter-menu-section ag-filter-menu-section--border">
      <button
        class="ag-filter-menu-item"
        [class.ag-filter-menu-item--active]="grouped()"
        (click)="toggleGroup.emit()"
      >{{ grouped() ? '⊟ ' + localeText().ungroup : '⊞ ' + localeText().groupBy(header()) }}</button>
    </div>
  }

  @if (filterable()) {
    <div class="ag-filter-menu-section ag-filter-menu-section--border">
      <button class="ag-filter-menu-item ag-filter-menu-item--muted" (click)="clearFilter.emit()">
        ✕ {{ localeText().clearFilter }}
      </button>
      <button class="ag-filter-menu-item ag-filter-menu-item--muted" (click)="clearAll.emit()">
        ✕ {{ localeText().clearAllFilters }}
      </button>
    </div>

    <div class="ag-filter-menu-section ag-filter-menu-section--border">
      <input
        class="ag-filter-menu-search"
        [value]="search()"
        (input)="searchChange.emit($any($event.target).value)"
        [placeholder]="localeText().searchValuesPlaceholder"
        (click)="$event.stopPropagation()"
      />
    </div>

    <div class="ag-filter-menu-values">
      <label class="ag-filter-menu-value">
        <input
          type="checkbox"
          [checked]="allSelected()"
          (change)="toggleAll.emit()"
        />
        <span class="ag-filter-menu-value-label">{{ localeText().selectAll }}</span>
      </label>
      @for (item of valueItems(); track item.rawStr) {
        <label
          class="ag-filter-menu-value"
          [class.ag-filter-menu-value--inactive]="!item.active"
        >
          <input
            type="checkbox"
            [checked]="item.selected"
            [disabled]="!item.active"
            (change)="toggleValue.emit(item.rawStr)"
          />
          <span class="ag-filter-menu-value-label">{{ item.label || localeText().blank }}</span>
        </label>
      }
    </div>
  }
</div>
