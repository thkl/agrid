<div class="ag-menu-bar" role="toolbar" [attr.aria-label]="label()">
  @for (item of items(); track item.id) {
    @let children = visibleChildren(item);
    <div class="ag-menu-bar-group" [attr.data-menu-id]="item.id">
      <button type="button" class="ag-menu-bar-button"
        [class.ag-menu-bar-button--active]="isActive(item)"
        [class.ag-menu-bar-button--split]="children.length > 0"
        [disabled]="isDisabled(item)"
        [attr.aria-pressed]="item.active !== undefined ? isActive(item) : null"
        (click)="runAction($event, item)">
        @if (item.icon) {
          <agrid-menu-icon [class]="item.class">{{item.icon}}</agrid-menu-icon>
        }
        <span class="ag-menu-bar-label">{{ item.label }}</span>
      </button>
      @if (children.length > 0) {
        <button type="button" class="ag-menu-bar-trigger"
          [class.ag-menu-bar-trigger--open]="openItemId() === item.id"
          [attr.aria-label]="item.label + ': ' + label()"
          [attr.aria-expanded]="openItemId() === item.id" aria-haspopup="menu"
          [disabled]="isDisabled(item)"
          (click)="toggleMenu($event, item)"
          (keydown)="onTriggerKeydown($event, item)">&#9662;</button>
        @if (openItemId() === item.id) {
          <div class="ag-menu-bar-dropdown" role="menu" [attr.aria-label]="item.label"
            [style.--ag-menu-bar-dropdown-shift.px]="dropdownShift(item.id)"
            (click)="$event.stopPropagation()" (keydown)="onMenuKeydown($event)">
            @for (child of children; track child.id) {
              <button type="button" class="ag-menu-bar-dropdown-item" role="menuitem"
                [class.ag-menu-bar-dropdown-item--active]="isActive(child)"
                [disabled]="isDisabled(child)"
                [attr.aria-current]="isActive(child) ? 'true' : null"
                (click)="runAction($event, child)">
                <span class="ag-menu-bar-dropdown-check" aria-hidden="true">{{ isActive(child) ? '&#10003;' : '' }}</span>
                @if (child.icon) {
                 <agrid-menu-icon [class]="item.class">{{child.icon}}</agrid-menu-icon>
                }
                <span class="ag-menu-bar-label">{{ child.label }}</span>
              </button>
            }
          </div>
        }
      }
    </div>
  }
</div>
