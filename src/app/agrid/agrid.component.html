<div
  #wrapper
  class="ag-wrapper"
  tabindex="0"
  (keydown)="onKeyDown($event)"
  (click)="closeContextMenu()"
>
  <div
    class="ag-header"
    [style.grid-template-columns]="gridTemplateColumns()"
    [style.min-width.px]="totalWidth()"
  >
    @if (showControlColumn()) {
      <div class="ag-header-cell ag-control-header"></div>
    }
    @for (col of colDefs(); track col.field) {
      <div class="ag-header-cell">
        <span class="ag-header-cell-label">{{ col.header }}</span>
        <div class="ag-resize-handle" (mousedown)="onResizeStart($event, col)"></div>
      </div>
    }
  </div>

  <cdk-virtual-scroll-viewport
    class="ag-body"
    [itemSize]="rowHeight()"
    [style.min-width.px]="totalWidth()"
  >
    <div
      *cdkVirtualFor="let row of displayRows(); let i = index; trackBy: trackByIndex"
      class="ag-row"
      [class.ag-add-row]="row === null"
      [class.ag-add-row--selected]="row === null && isAddRowSelected(i)"
      [style.height.px]="rowHeight()"
      [style.grid-template-columns]="row !== null ? gridTemplateColumns() : null"
    >
      @if (row !== null) {
        @if (showControlColumn()) {
          <div
            class="ag-control-cell"
            (contextmenu)="onControlContextMenu($event, i)"
            (click)="$event.stopPropagation()"
          ></div>
        }
        @for (col of colDefs(); track col.field; let ci = $index) {
          <agrid-cell
            [col]="col"
            [rowIndex]="i"
            [colIndex]="ci"
            [value]="row[col.field]"
            [selected]="isSelected(i, ci)"
            [editing]="isEditing(i, ci)"
            [seedChar]="getSeedChar(i, ci)"
            (activate)="onActivate(i, ci)"
            (startEdit)="onStartEdit(i, ci)"
            (draftChange)="onDraftChange($event)"
          />
        }
      } @else {
        <div class="ag-add-row-label" (click)="onActivateAddRow(i)">
          <span class="ag-add-row-icon">+</span> Add row
        </div>
      }
    </div>
  </cdk-virtual-scroll-viewport>

  @if (contextMenu(); as menu) {
    <div
      class="ag-context-menu"
      [style.left.px]="menu.x"
      [style.top.px]="menu.y"
      (click)="$event.stopPropagation()"
    >
      <button class="ag-context-item ag-context-item--danger" (click)="deleteRow(menu.rowIndex)">
        Delete row
      </button>
    </div>
  }
</div>
