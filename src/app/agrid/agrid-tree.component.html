<div #tree class="ag-tree" role="tree" [attr.aria-label]="provider().ariaLabel"
  [attr.aria-multiselectable]="provider().selection === 'multi' ? 'true' : null">
  @for (item of items(); track trackItem($index, item); let index = $index) {
    <div class="ag-tree-node" role="treeitem" [attr.data-tree-index]="index"
      [attr.tabindex]="focusedIndex() === index ? 0 : -1"
      [attr.aria-level]="item.level + 1"
      [attr.aria-expanded]="item.expandable ? item.expanded : null"
      [attr.aria-selected]="provider().selection !== 'none' ? isSelected(item) : null"
      [class.ag-tree-node--selected]="isSelected(item)"
      [style.padding-left.px]="8 + item.level * 20"
      (click)="onNodeClick($event, item, index)"
      (dblclick)="onNodeDoubleClick($event, item)"
      (keydown)="onKeydown($event, item, index)">
      <button class="ag-tree-toggle" type="button" tabindex="-1"
        [class.ag-tree-toggle--expanded]="item.expanded"
        [class.ag-tree-toggle--hidden]="!item.expandable"
        [attr.aria-label]="(item.expanded ? 'Collapse ' : 'Expand ') + label(item)"
        (click)="toggleNode(item); $event.stopPropagation()">&#9656;</button>
      <span class="ag-tree-content">
        <span class="ag-tree-label">{{ label(item) }}</span>
        @if (description(item); as detail) {
          <span class="ag-tree-description">{{ detail }}</span>
        }
      </span>
    </div>
  } @empty {
    <div class="ag-tree-empty">{{ provider().emptyText }}</div>
  }
</div>
