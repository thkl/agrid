<div class="ag-find-panel" (click)="$event.stopPropagation()">
  <input
    #findInput
    class="ag-find-input"
    [value]="query()"
    (input)="queryChange.emit($any($event.target).value)"
    (keydown)="onKeyDown($event)"
    [placeholder]="localeText().findPlaceholder"
  />
  <span class="ag-find-count">{{ countLabel() }}</span>
  <button class="ag-find-btn" [title]="localeText().previous" (click)="previous.emit()">↑</button>
  <button class="ag-find-btn" [title]="localeText().next" (click)="next.emit()">↓</button>
  <button class="ag-find-btn" [title]="localeText().close" (click)="close.emit()">✕</button>
</div>
