name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - run: corepack enable

      - run: pnpm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm ng build --configuration production --base-href /agrid/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/agrid/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4