name: Deploy Angular to GitHub Pages

on:
  push:
    tags:
      - "v*"
      - "V*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Configure pnpm build permissions
        run: |
          echo "allowBuilds:" > pnpm-workspace.yaml
          echo "  - '@parcel/watcher'" >> pnpm-workspace.yaml
          echo "  - 'esbuild'" >> pnpm-workspace.yaml
          echo "  - 'lmdb'" >> pnpm-workspace.yaml
          echo "  - 'msgpackr-extract'" >> pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm exec ng build --configuration production --base-href /agrid/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/agrid/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4